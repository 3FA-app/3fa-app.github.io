# Production release-origin monitor. This remains intentionally red until
# DEN-1488 provisions a resolving TLS origin and non-empty latest.json.
name: release-origin-live

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-origin-live
  cancel-in-progress: true

jobs:
  verify:
    name: "DEN-1488: release origin resolves and manifest is non-empty"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: https://3fa-app.github.io
      BASE_PATH: /
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build with the configured production release origin
        run: npm run build
      - name: Require public DNS and a non-empty release manifest
        run: npm run test:releases-origin
