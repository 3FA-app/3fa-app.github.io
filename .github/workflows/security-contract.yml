name: security-contract

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://3fa-app.github.io
      BASE_PATH: /
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate all workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the static site
        run: npm run build
      - name: Run the offline security and dependency contract suites
        run: node --test tests/security-contract.test.mjs tests/dependency-contract.test.mjs
      - name: Enforce the production dependency audit
        run: npm run audit:prod
